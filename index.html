<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Firdous Rahaman</title>
<meta http-equiv="refresh" content="1;url=https://firdous-rahaman.vercel.app/"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cyan: #00f5ff;
    --purple: #a855f7;
    --bg: #020408;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Space Grotesk', sans-serif;
  }

  /* ── CANVAS PARTICLES ── */
  canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* ── CENTER STAGE ── */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  /* ── RING ── */
  .ring-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    margin-bottom: 40px;
    animation: floatY 3s ease-in-out infinite;
  }

  @keyframes floatY {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid transparent;
  }

  .ring-1 {
    border-top-color: var(--cyan);
    border-right-color: var(--cyan);
    animation: spin1 1.6s linear infinite;
  }
  .ring-2 {
    inset: 14px;
    border-bottom-color: var(--purple);
    border-left-color: var(--purple);
    animation: spin2 2.2s linear infinite;
  }
  .ring-3 {
    inset: 28px;
    border-top-color: rgba(0,245,255,0.4);
    border-right-color: rgba(168,85,247,0.4);
    animation: spin1 3s linear infinite reverse;
  }

  @keyframes spin1 { to { transform: rotate(360deg); } }
  @keyframes spin2 { to { transform: rotate(-360deg); } }

  .avatar {
    position: absolute;
    inset: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(0,245,255,0.15), rgba(168,85,247,0.15));
    border: 1px solid rgba(0,245,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }

  /* ── NAME ── */
  .name-wrap {
    text-align: center;
    overflow: hidden;
  }

  .name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 10vw, 88px);
    letter-spacing: 6px;
    line-height: 1;
    background: linear-gradient(90deg, var(--cyan) 0%, #fff 40%, var(--purple) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: slideUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .tagline {
    margin-top: 10px;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    animation: slideUp 0.7s 0.15s cubic-bezier(0.22,1,0.36,1) both;
  }

  .tagline span {
    color: var(--cyan);
    opacity: 0.7;
  }

  /* ── DIVIDER ── */
  .divider {
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
    margin: 28px 0;
    animation: expandW 0.8s 0.3s ease forwards;
  }
  @keyframes expandW { to { width: 280px; } }

  /* ── REDIRECT TEXT ── */
  .redirect-text {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 2px;
    animation: fadeIn 0.5s 0.5s ease both;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ── PROGRESS BAR ── */
  .bar-track {
    width: 220px;
    height: 2px;
    background: rgba(255,255,255,0.07);
    border-radius: 99px;
    margin-top: 16px;
    overflow: hidden;
    animation: fadeIn 0.5s 0.5s ease both;
  }

  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    border-radius: 99px;
    animation: fillBar 1s 0.5s cubic-bezier(0.4,0,0.2,1) forwards;
    box-shadow: 0 0 12px var(--cyan);
  }
  @keyframes fillBar { to { width: 100%; } }

  /* ── GLOW ORBS ── */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 1;
    animation: pulse 4s ease-in-out infinite;
  }
  .orb-1 {
    width: 400px; height: 400px;
    background: rgba(0,245,255,0.06);
    top: -100px; left: -100px;
  }
  .orb-2 {
    width: 500px; height: 500px;
    background: rgba(168,85,247,0.07);
    bottom: -150px; right: -100px;
    animation-delay: 2s;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 0.7; }
    50%      { transform: scale(1.1); opacity: 1; }
  }

  /* ── CORNER DECOR ── */
  .corner {
    position: fixed;
    width: 60px; height: 60px;
    z-index: 5;
    opacity: 0.25;
  }
  .corner::before, .corner::after {
    content: '';
    position: absolute;
    background: var(--cyan);
  }
  .corner::before { width: 100%; height: 1px; top: 0; left: 0; }
  .corner::after  { width: 1px; height: 100%; top: 0; left: 0; }

  .c-tl { top: 24px; left: 24px; }
  .c-tr { top: 24px; right: 24px; transform: scaleX(-1); }
  .c-bl { bottom: 24px; left: 24px; transform: scaleY(-1); }
  .c-br { bottom: 24px; right: 24px; transform: scale(-1); }
</style>
</head>
<body>

<!-- particles -->
<canvas id="c"></canvas>

<!-- glow orbs -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<!-- corner brackets -->
<div class="corner c-tl"></div>
<div class="corner c-tr"></div>
<div class="corner c-bl"></div>
<div class="corner c-br"></div>

<!-- main content -->
<div class="stage">
  <div class="ring-wrap">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="avatar">✦</div>
  </div>

  <div class="name-wrap">
    <div class="name">Firdous Rahaman</div>
    <div class="tagline">Developer &nbsp;<span>//</span>&nbsp; IoT &nbsp;<span>//</span>&nbsp; ML Engineer</div>
  </div>

  <div class="divider"></div>

  <div class="redirect-text">Redirecting to portfolio&hellip;</div>
  <div class="bar-track">
    <div class="bar-fill"></div>
  </div>
</div>

<script>
  // ── Particle Canvas ──
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x  = Math.random() * W;
      this.y  = Math.random() * H;
      this.vx = (Math.random() - 0.5) * 0.3;
      this.vy = (Math.random() - 0.5) * 0.3;
      this.r  = Math.random() * 1.5 + 0.5;
      this.a  = Math.random() * 0.5 + 0.1;
      this.cyan = Math.random() > 0.5;
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.reset();
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = this.cyan
        ? `rgba(0,245,255,${this.a})`
        : `rgba(168,85,247,${this.a})`;
      ctx.fill();
    }
  }

  for (let i = 0; i < 120; i++) particles.push(new Particle());

  // draw connecting lines between nearby particles
  function drawLines() {
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 90) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(0,245,255,${0.06 * (1 - dist/90)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => { p.update(); p.draw(); });
    drawLines();
    requestAnimationFrame(loop);
  }
  loop();

  // ── Redirect after 1 second ──
  setTimeout(() => {
    window.location.href = 'https://firdous-rahaman.vercel.app/';
  }, 1000);
</script>
</body>
</html>
